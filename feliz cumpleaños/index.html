<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Un pequeño detallito que te hice</title>
    
    <!-- Font Awesome para la pistola -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: #0a050d;
            background: radial-gradient(circle at center, #1b0c25 0%, #0a050d 80%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ============================================================ */
        /*  LOGIN */
        /* ============================================================ */
        .login-container {
            position: fixed;
            z-index: 30;
            background: rgba(15, 5, 25, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px 35px 45px;
            border: 2px solid rgba(255, 0, 127, 0.3);
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.2);
            text-align: center;
            width: 340px;
            max-width: 92vw;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-container h2 {
            font-size: 1.6rem;
            color: #ff007f;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-container p {
            font-size: 0.95rem;
            color: #ddd;
            margin-bottom: 25px;
        }

        .pin-display {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 0, 127, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1.6rem;
            text-align: center;
            letter-spacing: 6px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-family: monospace;
        }

        .pin-keyboard {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 10px;
            width: 100%;
        }

        .key {
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid rgba(255, 0, 127, 0.3);
            padding: 16px 0;
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .key:hover {
            background: rgba(255, 0, 127, 0.25);
        }

        .key:active {
            transform: scale(0.92);
        }

        .key.clear {
            color: #ff3366;
        }

        .key.enter {
            color: #00ff7f;
            background: rgba(0, 255, 127, 0.1);
            border-color: rgba(0, 255, 127, 0.3);
        }

        .key.enter:hover {
            background: rgba(0, 255, 127, 0.2);
        }

        .error-msg {
            color: #ff3366;
            font-size: 0.9rem;
            margin-top: 15px;
            min-height: 25px;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
            font-weight: 500;
        }

        .login-container.hidden {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            pointer-events: none;
            visibility: hidden;
        }

        /* ============================================================ */
        /*  CINEMÁTICA: PISTOLA + REGALO */
        /* ============================================================ */
        .cinematica-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1b0c25 0%, #0a050d 80%);
            cursor: pointer;
        }

        .cinematica-container.active {
            display: flex;
        }

        .pistola-icon {
            font-size: 120px;
            color: #ff1493;
            filter: drop-shadow(0 0 40px rgba(255, 20, 147, 0.5));
            transition: transform 0.15s ease;
            transform: rotate(-20deg);
            position: absolute;
            left: 5%;
            bottom: 25%;
            z-index: 10;
        }

        .pistola-icon.disparando {
            transform: rotate(-15deg) translateX(20px) scale(0.9);
            filter: drop-shadow(0 0 60px rgba(255, 20, 147, 0.8));
        }

        .regalo-icon {
            position: absolute;
            right: 5%;
            bottom: 20%;
            font-size: 135px;
            z-index: 10;
            filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.35));
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .regalo-icon.explotando {
            animation: explotarRegalo 0.8s ease forwards;
        }

        @keyframes explotarRegalo {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            30% { transform: scale(1.4) rotate(15deg); opacity: 0.9; }
            100% { transform: scale(2.5) rotate(40deg); opacity: 0; }
        }

        .flor-disparo {
            position: absolute;
            font-size: 40px;
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
            left: 13%;
            bottom: 33%;
        }

        .flor-disparo.activo {
            animation: viajarAlRegalo 0.9s ease-in-out forwards;
        }

        @keyframes viajarAlRegalo {
            0% { opacity: 1; transform: scale(0.5) translate(0, 0); }
            40% { opacity: 1; transform: scale(1.1) translate(140px, -10px); }
            100% { opacity: 0; transform: scale(1.5) translate(440px, -20px); }
        }

        .texto-carga {
            position: absolute;
            bottom: 5%;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 20;
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            letter-spacing: 1px;
            animation: parpadear 1.5s ease-in-out infinite;
            pointer-events: none;
            padding: 0 20px;
        }

        .texto-carga span {
            color: #ff1493;
            font-weight: bold;
        }

        @keyframes parpadear {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ============================================================ */
        /*  TEXTO */
        /* ============================================================ */
        .texto-libre {
            position: fixed;
            top: 4%;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            padding: 0 20px;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .texto-libre.visible {
            opacity: 1;
        }

        .texto-libre .titulo {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3), 0 0 60px rgba(255, 0, 127, 0.3);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .texto-libre .frase {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 700;
            font-style: italic;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        #arbolCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            pointer-events: none;
            background: transparent;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #arbolCanvas.visible {
            opacity: 1;
        }

        /* ============================================================ */
        /*  CONFETI Y PÉTALOS */
        /* ============================================================ */
        .confeti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
            overflow: hidden;
        }

        .confeti {
            position: absolute;
            width: 8px;
            height: 8px;
            top: -20px;
            animation: caerConfeti linear forwards;
        }

        @keyframes caerConfeti {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
        }

        .petalo {
            position: fixed;
            font-size: 16px;
            pointer-events: none;
            z-index: 25;
            animation: caerPetalo linear forwards;
        }

        @keyframes caerPetalo {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg) scale(0.5); opacity: 0; }
        }

        @media (max-width: 500px) {
            .texto-libre .titulo { font-size: 2rem; }
            .texto-libre .frase { font-size: 1rem; }
            .login-container { padding: 30px 20px 35px; }
            .key { padding: 14px 0; font-size: 1.1rem; }
            .pin-display { font-size: 1.3rem; letter-spacing: 4px; min-height: 50px; }
            .pistola-icon { font-size: 90px; left: 3%; bottom: 22%; }
            .regalo-icon { font-size: 100px; right: 3%; bottom: 18%; }
            .flor-disparo { font-size: 32px; left: 11%; bottom: 30%; }
            @keyframes viajarAlRegalo {
                0% { opacity: 1; transform: scale(0.5) translate(0, 0); }
                40% { opacity: 1; transform: scale(1.1) translate(90px, -8px); }
                100% { opacity: 0; transform: scale(1.5) translate(310px, -15px); }
            }
            .texto-carga { font-size: 12px; bottom: 3%; }
        }
    </style>
</head>
<body>

    <!-- CANVAS DE PARTÍCULAS -->
    <canvas id="particleCanvas"></canvas>

    <!-- ============================================================ -->
    <!--  LOGIN -->
    <!-- ============================================================ -->
    <div class="login-container" id="loginContainer">
        <h2>🔐 Acceso Privado</h2>
        <p>INTRODUCE TU FECHA DE NACIMIENTO</p>

        <div class="pin-display" id="pinDisplay"> </div>

        <div class="pin-keyboard">
            <div class="key" data-num="1">1</div>
            <div class="key" data-num="2">2</div>
            <div class="key" data-num="3">3</div>
            <div class="key" data-num="4">4</div>
            <div class="key" data-num="5">5</div>
            <div class="key" data-num="6">6</div>
            <div class="key" data-num="7">7</div>
            <div class="key" data-num="8">8</div>
            <div class="key" data-num="9">9</div>
            <div class="key clear" data-borrar>⌫</div>
            <div class="key" data-num="0">0</div>
            <div class="key enter" data-confirmar>✅</div>
        </div>

        <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- ============================================================ -->
    <!--  CINEMÁTICA: PISTOLA + REGALO -->
    <!-- ============================================================ -->
    <div class="cinematica-container" id="cinematicaContainer">
        <i class="fas fa-gun pistola-icon" id="pistola"></i>
        <div class="regalo-icon" id="regalo">🎁</div>
        <div class="flor-disparo" id="florDisparo">🌼</div>
        <div class="texto-carga">🌸 Toca la pantalla para <span>disparar</span> la flor al regalo 🎁</div>
    </div>

    <!-- ============================================================ -->
    <!--  TEXTO -->
    <!-- ============================================================ -->
    <div class="texto-libre" id="textoLibre">
        <div class="titulo">🌸 Un pequeño detallito que te hice 🌸</div>
        <div class="frase">✨ "Las flores no necesitan palabras, ¿verdad?" ✨</div>
    </div>

    <!-- CANVAS DEL ÁRBOL -->
    <canvas id="arbolCanvas"></canvas>

    <!-- ============================================================ -->
    <!--  🎵 MÚSICA -->
    <!-- ============================================================ -->
    <audio id="bgMusic" loop preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>

    <script>
        // ============================================================
        //  LOGIN
        // ============================================================
        const CLAVE_CORRECTA = '07092003';
        let entrada = '';

        const loginContainer = document.getElementById('loginContainer');
        const display = document.getElementById('pinDisplay');
        const errorMsg = document.getElementById('errorMsg');
        const textoLibre = document.getElementById('textoLibre');
        const arbolCanvas = document.getElementById('arbolCanvas');
        const audio = document.getElementById('bgMusic');

        const cinematicaContainer = document.getElementById('cinematicaContainer');
        const pistola = document.getElementById('pistola');
        const regalo = document.getElementById('regalo');
        const flor = document.getElementById('florDisparo');

        let arbolIniciado = false;
        let puedeDisparar = true;
        let regaloExplotado = false;

        // --- TECLADO VIRTUAL ---
        document.querySelectorAll('[data-num]').forEach(btn => {
            btn.addEventListener('click', () => {
                const num = btn.dataset.num;
                if (entrada.length < 8) {
                    entrada += num;
                    actualizarDisplay();
                    errorMsg.textContent = '';
                }
            });
        });

        document.querySelector('[data-borrar]').addEventListener('click', () => {
            entrada = entrada.slice(0, -1);
            actualizarDisplay();
            errorMsg.textContent = '';
        });

        document.querySelector('[data-confirmar]').addEventListener('click', () => {
            if (entrada === CLAVE_CORRECTA) {
                loginContainer.classList.add('hidden');

                audio.volume = 0.5;
                audio.play().catch(() => {});

                setTimeout(() => {
                    cinematicaContainer.classList.add('active');
                }, 600);

            } else {
                errorMsg.textContent = '❌ No es esa fecha, intenta de nuevo';
                entrada = '';
                actualizarDisplay();
                if (navigator.vibrate) navigator.vibrate(20);

                loginContainer.style.animation = 'shake 0.3s ease';
                setTimeout(() => {
                    loginContainer.style.animation = '';
                }, 300);
            }
        });

        function actualizarDisplay() {
            const mostrado = entrada.padEnd(8, ' ').split('').join(' ');
            display.textContent = mostrado || ' ';
        }

        const styleShake = document.createElement('style');
        styleShake.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-10px); }
                40% { transform: translateX(10px); }
                60% { transform: translateX(-5px); }
                80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(styleShake);

        // ============================================================
        //  SONIDO DE DISPARO
        // ============================================================
        function crearSonidoDisparo() {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.015));
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1500;
                filter.Q.value = 0.8;
                const gain = audioCtx.createGain();
                gain.gain.value = 0.5;
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
                noise.stop(audioCtx.currentTime + 0.05);
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05);
                    gain2.gain.value = 0.08;
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                }, 15);
            } catch(e) {}
        }

        // ============================================================
        //  SONIDO DE EXPLOSIÓN
        // ============================================================
        function crearSonidoExplosion() {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 0.2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.05));
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400;
                const gain = audioCtx.createGain();
                gain.gain.value = 0.5;
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
                noise.stop(audioCtx.currentTime + 0.2);
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = 150;
                    gain2.gain.value = 0.1;
                    gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                }, 80);
            } catch(e) {}
        }

        // ============================================================
        //  DISPARO
        // ============================================================
        function disparar() {
            if (!puedeDisparar || regaloExplotado) return;
            puedeDisparar = false;

            crearSonidoDisparo();
            pistola.classList.add('disparando');

            flor.classList.remove('activo');
            void flor.offsetWidth;
            flor.classList.add('activo');

            setTimeout(() => {
                crearSonidoExplosion();
                regalo.classList.add('explotando');
                regaloExplotado = true;

                lanzarConfeti();
                lanzarPetalos();

                setTimeout(() => {
                    textoLibre.classList.add('visible');
                    arbolCanvas.classList.add('visible');

                    if (!arbolIniciado) {
                        iniciarArbol();
                        arbolIniciado = true;
                    }

                    setTimeout(() => {
                        cinematicaContainer.classList.remove('active');
                    }, 1200);

                }, 400);

                setTimeout(() => {
                    pistola.classList.remove('disparando');
                    flor.classList.remove('activo');
                    puedeDisparar = true;
                    setTimeout(() => {
                        regalo.classList.remove('explotando');
                        regaloExplotado = false;
                        regalo.style.opacity = '1';
                        regalo.style.transform = 'scale(1)';
                    }, 1500);
                }, 800);

            }, 750);
        }

        // ============================================================
        //  CONFETI
        // ============================================================
        function lanzarConfeti() {
            const container = document.createElement('div');
            container.className = 'confeti-container';
            document.body.appendChild(container);

            const colores = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6BD6', '#FFB347', '#A66CFF', '#FF8A80', '#FF007F', '#FF1493'];

            for (let i = 0; i < 80; i++) {
                const el = document.createElement('div');
                el.className = 'confeti';
                const size = 5 + Math.random() * 10;
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.background = colores[Math.floor(Math.random() * colores.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.style.animationDuration = (1.8 + Math.random() * 2.2) + 's';
                el.style.animationDelay = (Math.random() * 1) + 's';
                container.appendChild(el);
            }

            setTimeout(() => {
                container.remove();
            }, 3500);
        }

        // ============================================================
        //  PÉTALOS
        // ============================================================
        function lanzarPetalos() {
            const emojis = ['🌸', '🌺', '🌷', '🌹', '🌼'];
            for (let i = 0; i < 30; i++) {
                const el = document.createElement('div');
                el.className = 'petalo';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.top = '-20px';
                el.style.fontSize = (12 + Math.random() * 16) + 'px';
                el.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
                el.style.animationDelay = (Math.random() * 1.2) + 's';
                document.body.appendChild(el);
                setTimeout(() => {
                    el.remove();
                }, 5000);
            }
        }

        // ============================================================
        //  EVENTOS
        // ============================================================
        cinematicaContainer.addEventListener('click', disparar);
        cinematicaContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            disparar();
        });

        // ============================================================
        //  PARTÍCULAS DE FONDO (OPTIMIZADAS)
        // ============================================================
        const canvasBg = document.getElementById('particleCanvas');
        const ctxBg = canvasBg.getContext('2d');
        let particles = [];
        let bgAnimId = null;

        function resizeCanvas() {
            canvasBg.width = window.innerWidth;
            canvasBg.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvasBg.width;
                this.y = Math.random() * canvasBg.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * -0.2 - 0.05;
                const colors = ['#ff007f', '#a100ff', '#ff00ff', '#8600c8'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random() * 0.2 + 0.05;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < 0) {
                    this.y = canvasBg.height;
                    this.x = Math.random() * canvasBg.width;
                }
                if (this.x < 0) this.x = canvasBg.width;
                if (this.x > canvasBg.width) this.x = 0;
            }
            draw() {
                ctxBg.save();
                ctxBg.globalAlpha = this.opacity;
                ctxBg.beginPath();
                ctxBg.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctxBg.fillStyle = this.color;
                ctxBg.shadowBlur = 2;
                ctxBg.shadowColor = this.color;
                ctxBg.fill();
                ctxBg.restore();
            }
        }

        for (let i = 0; i < 15; i++) particles.push(new Particle());

        function animateBg() {
            ctxBg.clearRect(0, 0, canvasBg.width, canvasBg.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            bgAnimId = requestAnimationFrame(animateBg);
        }
        animateBg();

        // ============================================================
        //  🌸 ÁRBOL OPTIMIZADO (MANTIENE 400 FLORES)
        // ============================================================
        const canvasArbol = document.getElementById('arbolCanvas');
        const ctxArbol = canvasArbol.getContext('2d');
        let animArbol = null;
        let flores = [];
        let pasto = [];
        let progresoCrecimiento = 0;
        let faseFlores = false;
        const VEL_CRECIMIENTO = 0.008;
        const TOTAL_FLORES = 400;
        let troncoData = null;
        let ramasData = [];
        let texturaTronco = [];

        function resizeArbolCanvas() {
            canvasArbol.width = window.innerWidth;
            canvasArbol.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeArbolCanvas);
        resizeArbolCanvas();

        function dibujarFlor(ctx, x, y, size, color, centroColor, alpha, rot) {
            if (alpha < 0.05) return;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(rot || 0);
            const s = size;
            const petalos = 5;
            ctx.shadowBlur = 12;
            ctx.shadowColor = color;
            for (let i = 0; i < petalos; i++) {
                const angle = (i / petalos) * Math.PI * 2;
                const px = Math.cos(angle) * s * 0.5;
                const py = Math.sin(angle) * s * 0.5;
                ctx.beginPath();
                ctx.ellipse(px, py, s * 0.4, s * 0.22, angle, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(0, 0, s * 0.15, 0, Math.PI * 2);
            ctx.fillStyle = centroColor;
            ctx.fill();
            ctx.restore();
        }

        function generarPasto(w, h, baseY) {
            const pastoGenerado = [];
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * w;
                const altura = 12 + Math.random() * 25;
                const curvatura = (Math.random() - 0.5) * 15;
                const grosor = 1 + Math.random() * 1.5;
                const tonoVerde = 0.3 + Math.random() * 0.3;
                const opacidad = 0.4 + Math.random() * 0.4;
                pastoGenerado.push({
                    x, y: baseY, altura, curvatura, grosor, tono: tonoVerde,
                    opacidad, fase: Math.random() * 100,
                    velFase: 0.005 + Math.random() * 0.008
                });
            }
            return pastoGenerado;
        }

        function dibujarPasto(ctx, w, h) {
            if (!troncoData) return;
            const baseY = troncoData.baseY;
            ctx.save();
            for (const b of pasto) {
                ctx.save();
                ctx.globalAlpha = b.opacidad * 0.7;
                ctx.translate(b.x, b.y);
                const movimiento = Math.sin(b.fase) * 1.5;
                const curva = b.curvatura + movimiento;
                const verde = Math.floor(80 + b.tono * 80);
                const gradPasto = ctx.createLinearGradient(0, 0, curva, -b.altura);
                gradPasto.addColorStop(0, `rgb(30, ${verde + 20}, 20)`);
                gradPasto.addColorStop(1, `rgb(50, ${verde + 50}, 35)`);
                ctx.strokeStyle = gradPasto;
                ctx.lineWidth = b.grosor;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(curva * 0.5, -b.altura * 0.5, curva, -b.altura);
                ctx.stroke();
                ctx.restore();
            }
            ctx.restore();
        }

        function generarPuntosCorazon(cx, cy, size, numPuntos) {
            const puntos = [];
            const escala = size / 16;
            function estaDentroCorazon(x, y) {
                const nx = x / escala, ny = y / escala;
                const x2 = nx * nx, y2 = ny * ny;
                return Math.pow(x2 + y2 - 1, 3) - x2 * ny * ny * ny <= 0;
            }
            let intentos = 0, generados = 0;
            while (generados < numPuntos && intentos < numPuntos * 8) {
                intentos++;
                const rx = (Math.random() * 2 - 1) * 16 * 1.05;
                const ry = (Math.random() * 2 - 1) * 16 * 1.05;
                if (estaDentroCorazon(rx, ry)) {
                    puntos.push({
                        x: cx + rx * escala + (Math.random() - 0.5) * 5,
                        y: cy - ry * escala * 0.9 + (Math.random() - 0.5) * 5
                    });
                    generados++;
                }
            }
            return puntos;
        }

        function generarEstructuraArbol(w, h) {
            const baseX = w / 2, baseY = h * 0.97;
            const troncoAltura = h * 0.42;
            const anchoTroncoBase = Math.min(w, h) * 0.05;
            troncoData = { baseX, baseY, altura: troncoAltura, anchoBase: anchoTroncoBase };
            pasto = generarPasto(w, h, baseY);

            texturaTronco = [];
            for (let i = 0; i < 4; i++) {
                const lineas = [];
                const xOff = (Math.random() - 0.5) * anchoTroncoBase * 0.7;
                for (let j = 0; j < 6; j++) {
                    const yPos = baseY - troncoAltura * (0.05 + j * 0.12);
                    lineas.push({ x: baseX + xOff + (Math.random() - 0.5) * 4, y: yPos });
                }
                texturaTronco.push(lineas);
            }

            ramasData = [];
            for (let i = 0; i < 6; i++) {
                const anguloBase = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
                const longitud = h * (0.20 + Math.random() * 0.14);
                const grosor = 5 + Math.random() * 5;
                const tY = 0.15 + Math.random() * 0.5;
                const startY = baseY - troncoAltura * tY;
                const startX = baseX + (Math.random() - 0.5) * anchoTroncoBase * 0.5;
                const endX = startX + Math.sin(anguloBase + Math.PI / 2) * longitud * 0.5;
                const endY = startY - Math.cos(anguloBase + Math.PI / 2) * longitud * 0.9;
                const rama = { startX, startY, endX, endY, grosor, secundarias: [] };
                if (i % 2 === 0) {
                    for (let j = 0; j < 2; j++) {
                        const t = 0.3 + Math.random() * 0.4;
                        const px = startX + (endX - startX) * t;
                        const py = startY + (endY - startY) * t;
                        const angSec = -Math.PI / 2 + (Math.random() - 0.5) * 1.0;
                        const lenSec = longitud * (0.3 + Math.random() * 0.3);
                        rama.secundarias.push({
                            x: px, y: py, angulo: angSec,
                            longitud: lenSec, grosor: grosor * 0.4
                        });
                    }
                }
                ramasData.push(rama);
            }

            flores = [];
            const centroCorazonX = baseX;
            const centroCorazonY = baseY - h * 0.46;
            const tamanioCorazon = Math.min(w, h) * 0.33;
            const puntosCorazon = generarPuntosCorazon(centroCorazonX, centroCorazonY, tamanioCorazon, TOTAL_FLORES);
            const colores = ['#ff4d8a', '#ff6b9d', '#ff80b3', '#ff99c2', '#ffb3cc', '#ff3388', '#ff1a75', '#e6005c', '#ff0066', '#ff1493', '#ff4da6', '#ff6699', '#ff8cba', '#ffaacc', '#ffcce0', '#ffd9e6', '#ff3366', '#ff6699', '#ff99cc', '#ffccdd'];
            const centros = ['#FFD700', '#FFC0CB', '#FF69B4', '#FFB6C1', '#FF1493', '#FFD700'];

            for (const p of puntosCorazon) {
                const distCentro = Math.sqrt(Math.pow(p.x - centroCorazonX, 2) + Math.pow(p.y - centroCorazonY, 2));
                const maxDist = tamanioCorazon * 0.9;
                const factorTamaño = 1 - Math.min(distCentro / maxDist, 1) * 0.3;
                const size = 8 + Math.random() * 16 + factorTamaño * 10;
                flores.push({
                    x: p.x, y: p.y, size,
                    color: colores[Math.floor(Math.random() * colores.length)],
                    centro: centros[Math.floor(Math.random() * centros.length)],
                    opacidad: 0,
                    velOpacidad: 0.015 + Math.random() * 0.025,
                    rot: Math.random() * Math.PI * 2,
                    velRot: (Math.random() - 0.5) * 0.004,
                    fase: Math.random() * 100,
                    velFase: 0.008 + Math.random() * 0.01,
                    offsetY: 0,
                    apareciendo: false,
                    retraso: Math.random() * 70,
                    contador: 0,
                });
            }
        }

        function dibujarTroncoYRamass(ctx, w, h, factor) {
            if (!troncoData) return;
            const { baseX, baseY, altura, anchoBase } = troncoData;
            const troncoAltura = altura * factor;
            const anchoTronco = anchoBase * (0.5 + 0.5 * factor);
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(255, 0, 127, 0.08)';
            const gradTronco = ctx.createLinearGradient(baseX - anchoTronco, baseY, baseX + anchoTronco, baseY);
            gradTronco.addColorStop(0, '#1a0e08');
            gradTronco.addColorStop(0.2, '#3d2213');
            gradTronco.addColorStop(0.5, '#5a3520');
            gradTronco.addColorStop(0.8, '#3d2213');
            gradTronco.addColorStop(1, '#1a0e08');
            ctx.fillStyle = gradTronco;
            ctx.beginPath();
            const baseAncho = anchoTronco * 1.3;
            const topAncho = anchoTronco * 0.6;
            ctx.moveTo(baseX - baseAncho / 2, baseY);
            ctx.quadraticCurveTo(baseX - baseAncho / 2 * 1.1, baseY - troncoAltura * 0.3, baseX - topAncho / 2 * 0.9, baseY - troncoAltura * 0.6);
            ctx.quadraticCurveTo(baseX - topAncho / 2 * 0.7, baseY - troncoAltura * 0.9, baseX - topAncho / 2 * 0.5, baseY - troncoAltura);
            ctx.quadraticCurveTo(baseX, baseY - troncoAltura * 1.05, baseX + topAncho / 2 * 0.5, baseY - troncoAltura);
            ctx.quadraticCurveTo(baseX + topAncho / 2 * 0.7, baseY - troncoAltura * 0.9, baseX + topAncho / 2 * 0.9, baseY - troncoAltura * 0.6);
            ctx.quadraticCurveTo(baseX + baseAncho / 2 * 1.1, baseY - troncoAltura * 0.3, baseX + baseAncho / 2, baseY);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(80, 45, 25, 0.2)';
            ctx.lineWidth = 1;
            for (const lineas of texturaTronco) {
                ctx.beginPath();
                for (let j = 0; j < lineas.length; j++) {
                    const p = lineas[j];
                    const yAjustada = baseY - (baseY - p.y) * factor;
                    if (j === 0) ctx.moveTo(p.x, yAjustada);
                    else ctx.lineTo(p.x, yAjustada + 2);
                }
                ctx.stroke();
            }

            if (factor > 0.15) {
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(255, 0, 127, 0.04)';
                ctx.strokeStyle = '#3d2213';
                ctx.lineCap = 'round';
                for (const rama of ramasData) {
                    const f = Math.min(1, factor * 1.2);
                    if (f < 0.05) continue;
                    const endX = rama.startX + (rama.endX - rama.startX) * f;
                    const endY = rama.startY + (rama.endY - rama.startY) * f;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                    ctx.lineWidth = rama.grosor * f * 0.9;
                    ctx.beginPath();
                    ctx.moveTo(rama.startX, rama.startY);
                    ctx.quadraticCurveTo((rama.startX + endX) / 2, (rama.startY + endY) / 2 - 8 * f, endX, endY);
                    ctx.stroke();
                    if (factor > 0.4) {
                        for (const sec of rama.secundarias) {
                            const sf = Math.min(1, (factor - 0.3) * 1.5);
                            if (sf < 0.1) continue;
                            const secEndX = sec.x + Math.cos(sec.angulo + Math.PI / 2) * sec.longitud * sf * 0.5;
                            const secEndY = sec.y - Math.sin(sec.angulo + Math.PI / 2) * sec.longitud * sf * 0.8;
                            ctx.lineWidth = sec.grosor * sf * 0.8;
                            ctx.strokeStyle = 'rgba(60, 35, 20, 0.5)';
                            ctx.shadowBlur = 3;
                            ctx.beginPath();
                            ctx.moveTo(sec.x, sec.y);
                            ctx.quadraticCurveTo((sec.x + secEndX) / 2, (sec.y + secEndY) / 2 - 5 * sf, secEndX, secEndY);
                            ctx.stroke();
                        }
                    }
                }
            }
            ctx.restore();
        }

        function iniciarArbol() {
            const w = canvasArbol.width, h = canvasArbol.height;
            if (!troncoData) generarEstructuraArbol(w, h);
            progresoCrecimiento = 0;
            faseFlores = false;
            if (animArbol) cancelAnimationFrame(animArbol);
            dibujarArbol();
        }

        function dibujarArbol() {
            const w = canvasArbol.width, h = canvasArbol.height;
            ctxArbol.clearRect(0, 0, w, h);
            for (const b of pasto) b.fase += b.velFase;
            dibujarPasto(ctxArbol, w, h);
            if (progresoCrecimiento < 1) {
                progresoCrecimiento += VEL_CRECIMIENTO;
                if (progresoCrecimiento >= 1) {
                    progresoCrecimiento = 1;
                    faseFlores = true;
                    for (const flor of flores) flor.apareciendo = true;
                }
            }
            const factor = progresoCrecimiento;
            dibujarTroncoYRamass(ctxArbol, w, h, factor);
            if (faseFlores) {
                const limiteSuperior = h * 0.20;
                for (const flor of flores) {
                    flor.contador++;
                    if (flor.contador > flor.retraso && flor.apareciendo) {
                        flor.opacidad += flor.velOpacidad;
                        if (flor.opacidad >= 1) { flor.opacidad = 1;
                            flor.apareciendo = false; }
                    }
                    flor.fase += flor.velFase;
                    flor.offsetY = Math.sin(flor.fase) * 2;
                    flor.rot += flor.velRot;
                    if (flor.opacidad > 0.02 && factor > 0.2 && flor.y > limiteSuperior) {
                        const alpha = flor.opacidad * Math.min(1, (factor - 0.2) * 4);
                        dibujarFlor(ctxArbol, flor.x, flor.y + flor.offsetY, flor.size, flor.color, flor.centro, alpha, flor.rot);
                    }
                }
            }
            animArbol = requestAnimationFrame(dibujarArbol);
        }

        actualizarDisplay();
        window.addEventListener('resize', resizeArbolCanvas);
    </script>
</body>
